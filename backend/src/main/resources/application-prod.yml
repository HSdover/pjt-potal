# Production server database profile.
# Activate with:
#   SPRING_PROFILES_ACTIVE=prod
#   SPRING_PROFILES_ACTIVE=saml,prod
#
# The production profile never runs schema.sql/data.sql. Prepare application
# tables and Spring Batch BATCH_* metadata tables through the DBA-controlled
# migration path before startup.
spring:
  batch:
    jdbc:
      initialize-schema: ${GOVERNANCE_BATCH_SCHEMA_INITIALIZE:never}
  datasource:
    url: ${GOVERNANCE_PROD_DATASOURCE_URL:${GOVERNANCE_DATASOURCE_URL}}
    driver-class-name: ${GOVERNANCE_PROD_DATASOURCE_DRIVER:${GOVERNANCE_DATASOURCE_DRIVER:oracle.jdbc.OracleDriver}}
    username: ${GOVERNANCE_PROD_DATASOURCE_USERNAME:${GOVERNANCE_DATASOURCE_USERNAME}}
    password: ${GOVERNANCE_PROD_DATASOURCE_PASSWORD:${GOVERNANCE_DATASOURCE_PASSWORD}}
    hikari:
      pool-name: governance-prod-db
      maximum-pool-size: ${GOVERNANCE_DATASOURCE_MAX_POOL_SIZE:20}
      minimum-idle: ${GOVERNANCE_DATASOURCE_MIN_IDLE:5}
      connection-timeout: ${GOVERNANCE_DATASOURCE_CONNECTION_TIMEOUT:30000}
  sql:
    init:
      mode: ${GOVERNANCE_SQL_INIT_MODE:never}
  cache:
    type: ${GOVERNANCE_CACHE_TYPE:redis}
  h2:
    console:
      enabled: false

management:
  health:
    redis:
      enabled: ${GOVERNANCE_REDIS_HEALTH_ENABLED:true}
