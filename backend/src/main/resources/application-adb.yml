# Oracle Autonomous Database profile.
# Activate for local ADB verification with:
#   SPRING_PROFILES_ACTIVE=local,adb
#
# Required environment variables:
#   GOVERNANCE_DATASOURCE_URL
#   GOVERNANCE_DATASOURCE_USERNAME
#   GOVERNANCE_DATASOURCE_PASSWORD
#
# Wallet example:
#   GOVERNANCE_DATASOURCE_URL=jdbc:oracle:thin:@db_high?TNS_ADMIN=C:/workspace/secrets/adb-wallet
spring:
  datasource:
    url: ${GOVERNANCE_DATASOURCE_URL}
    driver-class-name: ${GOVERNANCE_DATASOURCE_DRIVER:oracle.jdbc.OracleDriver}
    username: ${GOVERNANCE_DATASOURCE_USERNAME}
    password: ${GOVERNANCE_DATASOURCE_PASSWORD}
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false
