spring:
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: embedded
  datasource:
    url: jdbc:h2:mem:governance_test;MODE=Oracle;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

app:
  attachment:
    storage-root: ${java.io.tmpdir}/governance-portal-test/attachments
  auth:
    local-dev-user:
      enabled: true
      user-id: local-test
      display-name: Local Test User
      password: local-test-pass
      permissions:
        - DASHBOARD_READ
        - META_VIEW
        - PIPELINE_READ
        - AI_AGENT_READ
        - REQUEST_READ
        - DP_VIEWER_READ
        - NOTICE_READ
        - PERMISSION_MANAGE
        - SAMPLE_READ
        - SAMPLE_CREATE
        - SAMPLE_UPDATE
        - SAMPLE_DELETE
        - SAMPLE_JPA_READ
        - SAMPLE_JPA_CREATE
        - SAMPLE_JPA_UPDATE
        - SAMPLE_JPA_DELETE
        - SAMPLE_JPA_EXPORT
        - SAMPLE_JPA_IMPORT
        - REF_VIEW
        - BATCH_ADMIN
      users:
        - user-id: local-test
          display-name: Local Test User
          password: local-test-pass
          permissions:
            - DASHBOARD_READ
            - META_VIEW
            - PIPELINE_READ
            - AI_AGENT_READ
            - REQUEST_READ
            - DP_VIEWER_READ
            - NOTICE_READ
            - PERMISSION_MANAGE
            - SAMPLE_READ
            - SAMPLE_CREATE
            - SAMPLE_UPDATE
            - SAMPLE_DELETE
            - SAMPLE_JPA_READ
            - SAMPLE_JPA_CREATE
            - SAMPLE_JPA_UPDATE
            - SAMPLE_JPA_DELETE
            - SAMPLE_JPA_EXPORT
            - SAMPLE_JPA_IMPORT
            - REF_VIEW
            - BATCH_ADMIN
